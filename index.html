<script>
/* ============================================================
   音效引擎
   ============================================================ */
const AudioEngine = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone({freq=440,dur=0.15,type='sine',vol=0.15,delay=0,sweep=null}) {
    const c = getCtx(); if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination); osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noise({dur=0.1,vol=0.1,delay=0,filterFreq=1000}) {
    const c = getCtx(); if (!c) return;
    const t0 = c.currentTime + delay;
    const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const filter = c.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = filterFreq;
    const gain = c.createGain(); gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter); filter.connect(gain); gain.connect(c.destination);
    src.start(t0); src.stop(t0 + dur);
  }
  return {
    tap() { tone({freq:660,dur:0.06,vol:0.08}); },
    clueGain() { tone({freq:880,dur:0.12,vol:0.12}); tone({freq:1320,dur:0.18,vol:0.1,delay:0.1}); },
    clueLose() { tone({freq:330,dur:0.2,type:'triangle',vol:0.15,sweep:220}); noise({dur:0.15,vol:0.08,filterFreq:400}); },
    ziCorrect() { tone({freq:784,dur:0.15,vol:0.13}); tone({freq:1046,dur:0.25,vol:0.12,delay:0.12}); },
    ziWrong() { tone({freq:220,dur:0.3,type:'sawtooth',vol:0.12,sweep:110}); noise({dur:0.2,vol:0.08,filterFreq:300}); },
    shiCorrect() { tone({freq:523,dur:0.14,vol:0.1}); tone({freq:659,dur:0.14,vol:0.1,delay:0.12}); tone({freq:784,dur:0.22,vol:0.1,delay:0.24}); },
    shiWrong() { tone({freq:392,dur:0.15,type:'triangle',vol:0.1}); tone({freq:311,dur:0.25,type:'triangle',vol:0.1,delay:0.15}); },
    pinCorrect() { noise({dur:0.4,vol:0.08,filterFreq:3000}); tone({freq:523,dur:0.15,vol:0.1}); tone({freq:784,dur:0.15,vol:0.1,delay:0.12}); tone({freq:1046,dur:0.3,vol:0.1,delay:0.24}); },
    pinWrong() { tone({freq:300,dur:0.1,type:'sawtooth',vol:0.1}); noise({dur:0.2,vol:0.1,filterFreq:500}); },
    wxWin() { tone({freq:523,dur:0.2,type:'triangle',vol:0.12}); tone({freq:659,dur:0.2,type:'triangle',vol:0.12,delay:0.15}); tone({freq:784,dur:0.35,type:'triangle',vol:0.12,delay:0.3}); },
    wxLose() { tone({freq:196,dur:0.25,type:'sawtooth',vol:0.12,sweep:150}); noise({dur:0.3,vol:0.08,filterFreq:300}); },
    wxDraw() { tone({freq:880,dur:0.1,vol:0.08}); },
    chooseKiller() { tone({freq:220,dur:0.25,vol:0.12}); },
    endGood() { tone({freq:523,dur:0.2,vol:0.12}); tone({freq:659,dur:0.2,vol:0.12,delay:0.18}); tone({freq:784,dur:0.25,vol:0.12,delay:0.36}); tone({freq:1046,dur:0.5,vol:0.12,delay:0.54}); },

    undo() { tone({freq:440,dur:0.08,type:'triangle',vol:0.08,sweep:330}); },

    deduceFail() { tone({freq:280,dur:0.3,type:'sawtooth',vol:0.12,sweep:200}); }
  };
})();

/* ============================================================
   元素引用 & 工具
   ============================================================ */
const $ = id => document.getElementById(id);
const main = $('main'), sceneBox = $('sceneBox'), panel = $('panel');
const feedbackEl = $('feedback');
const actionsEl = $('actions'), clueBar = $('clueBar');
const endScreen = $('endScreen'), overlayInner = $('overlayInner');
const topbar = $('topbar'), route = $('route');
const shenScene = $('shenScene'), sceneCanvas = $('sceneCanvas');
const deduceArea = $('deduceArea'), ddSlots = $('ddSlots'), ddClueList = $('ddClueList');
const cluePopup = $('cluePopup'), attitudeFloat = $('attitudeFloat');
const topicPanel = $('topicPanel'), tpTopics = $('tpTopics'), tpTopicActions = $('tpTopicActions');

function bumpStat(el) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 250); }
function updateStats() {
  const t = $('tokenCount'), c = $('clueCount'), g = $('gritVal'), h = $('heartVal');
  if (t.textContent !== String(state.tokens)) { t.textContent = state.tokens; bumpStat(t); }
  if (c.textContent !== String(state.clues)) { c.textContent = state.clues; bumpStat(c); }
  if (g.textContent !== String(state.grit)) { g.textContent = state.grit; bumpStat(g); }
  if (h.textContent !== String(state.heart)) { h.textContent = state.heart; bumpStat(h); }
  $('loopBadge').textContent = state.loop === 1 ? '一 周 目' : '二 周 目';
  clueBar.style.display = state.clues > 0 ? 'block' : 'none';
  if (state.clues > 0) clueBar.innerHTML = '<strong>已获线索：</strong>' + state.collectedClues.join(' · ');
}
function updateRoute() {
  document.querySelectorAll('#route .node').forEach((el, i) => {
    el.className = 'node' + (i < state.scene ? ' done' : i === state.scene ? ' active' : '');
  });
}
function showNextButton(label, fn) {
  actionsEl.innerHTML = '';
  showBackButton();
  const btn = document.createElement('button');
  btn.className = 'btn'; btn.textContent = label;
  btn.onclick = () => { AudioEngine.tap(); (fn || advance)(); };
  actionsEl.appendChild(btn);
}
function showAskButton() {
  const btn = document.createElement('button');
  btn.className = 'btn ghost'; btn.textContent = '问 ' + scenes[state.scene].npc.name;
  btn.onclick = () => { AudioEngine.tap(); openNpcDialog(state.scene); };
  actionsEl.appendChild(btn);
}
function showBackButton() {
  if (state.scene <= 0) return;
  const btn = document.createElement('button');
  btn.className = 'btn ghost'; btn.textContent = '← 上一景';
  btn.style.marginRight = 'auto';
  btn.onclick = () => { AudioEngine.tap(); goBack(); };
  actionsEl.appendChild(btn);
}
function addClue(name) {
  if (!name || state.collectedClues.includes(name)) return;
  state.clues++; state.collectedClues.push(name);
  updateStats();
  AudioEngine.clueGain();
}
function flashFeedback() {
  feedbackEl.classList.add('flash');
  setTimeout(() => feedbackEl.classList.remove('flash'), 700);
}
function showCluePopup(tag, title, desc) {
  $('cpTag').textContent = tag;
  $('cpTitle').textContent = title;
  $('cpDesc').textContent = desc || '';
  cluePopup.classList.add('show');
  clearTimeout(showCluePopup._t);
  showCluePopup._t = setTimeout(() => cluePopup.classList.remove('show'), 2200);
}
function showAttitude(text) {
  attitudeFloat.textContent = text;
  attitudeFloat.classList.add('show');
  clearTimeout(showAttitude._t);
  showAttitude._t = setTimeout(() => attitudeFloat.classList.remove('show'), 1500);
}
function goBack() {
  if (state.scene <= 0) return;
  state.scene--; state.phase = 'challenge';
  renderScene();
}

/* ============================================================
   心证抉择
   ============================================================ */
function renderHeartChoice(s, onDone) {
  const hc = s.heartChoice;
  if (!hc) { onDone(); return; }
  actionsEl.innerHTML = '';
  panel.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-title">心 证 抉 择<span class="tag">有些选择不写在纸上</span></div>`;
  const box = document.createElement('div');
  box.className = 'heart-choice-box';
  box.textContent = hc.prompt;
  card.appendChild(box);
  hc.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt heart-choice';
    b.textContent = `${String.fromCharCode(65+i)}. ${opt.text}`;
    b.onclick = () => {
      AudioEngine.heart();
      if (opt.heart) state.heart += opt.heart;
      if (opt.grit) state.grit += opt.grit;
      updateStats();
      card.querySelectorAll('.opt').forEach(x => x.disabled = true);
      b.classList.add('correct');
      feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 心证 ${opt.heart > 0 ? '+1' : '未增'}。</span> ${opt.tag === '偏执念' ? '你选择了让执念多走一步。' : '你选择了让理性多站一会儿。'}`;
      flashFeedback();
      showNextButton('继续前行 →', () => { onDone(); });
    };
    card.appendChild(b);
  });
  panel.appendChild(card);
  main.scrollTop = 0;
}

/* ============================================================
   场景渲染
   ============================================================ */
function renderScene() {
  const s = scenes[state.scene];
  if (!s) { renderEnding(); return; }
  updateRoute(); updateStats();

  panel.innerHTML = '';
  overlayInner.classList.remove('show');
  overlayInner.style.display = 'none';
  endScreen.classList.remove('show');
  endScreen.style.display = 'none';
  feedbackEl.style.display = 'block';
  feedbackEl.textContent = '';
  actionsEl.style.display = 'flex';
  actionsEl.innerHTML = '';
  clueBar.style.display = state.clues > 0 ? 'block' : 'none';
  shenScene.classList.remove('show');
  deduceArea.style.display = 'none';
  sceneBox.style.display = 'block';
  topicPanel.classList.remove('show');
  main.style.overflowY = 'auto';

  showBackButton();

  if (s.minigame === 'shen') {
    sceneBox.style.display = 'none';
    renderShenScene();
    return;
  }

  const desc = (state.loop === 2 && s.desc2) ? s.desc2 : s.desc;
  sceneBox.innerHTML = `<span class="place">${s.place}</span><div class="desc-text">${desc}</div>`;
  sceneBox.classList.remove('enter'); void sceneBox.offsetWidth; sceneBox.classList.add('enter');

  const mg = (state.loop === 2 && s.minigame2) ? s.minigame2 : s.minigame;
  if (mg === 'wuxing') { state.phase = 'wuxing'; renderWuxingScene(); return; }
  if (mg === 'qp') { state.phase = 'qp'; renderQpScene(); return; }

  state.phase = 'challenge';
  showAskButton();
  addTokenCard(sceneBox.parentNode, sceneBox.nextSibling);

  if (mg === 'zi') renderZi(s);
  else if (mg === 'shi') renderShi(s);
  else if (mg === 'pin') renderPin(s);
  else if (mg === 'dialect') renderDialect(s);
  else if (mg === 'bridge') renderBridge(s);
  else if (mg === 'couplet') renderCouplet(s);
  main.scrollTop = 0;
}

function addTokenCard(parent, before) {
  clearTokenCard();
  if (state.tokens <= 0 || state.usedTokens.includes(state.scene)) return;
  const card = document.createElement('div');
  card.className = 'card'; card.id = 'tmpTokenCard'; card.style.padding = '10px 14px';
  const tk = document.createElement('div');
  tk.className = 'token'; tk.textContent = '酒令签 ×1 · 换额外情报';
  tk.onclick = () => { AudioEngine.tap(); useToken(state.scene); };
  card.appendChild(tk);
  parent.insertBefore(card, before);
}
function clearTokenCard() {
  const old = document.getElementById('tmpTokenCard');
  if (old) old.remove();
}
function useToken(i) {
  if (state.tokens <= 0 || state.usedTokens.includes(i)) return;
  const s = scenes[i]; if (!s) return;
  state.tokens--; state.usedTokens.push(i);
  let bonus = state.loop === 2 ? (s.tokenBonus2 || s.tokenBonus) : s.tokenBonus;
  if (!bonus) bonus = '酒令签已用，但这一处没有额外的情报。';
  feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 酒令签已用。</span> ${bonus}`;
  flashFeedback();
  clearTokenCard();
  updateStats();
}

/* ============================================================
   沈园
   ============================================================ */
function renderShenScene() {
  if (!state.shen) state.shen = initShen();
  deduceArea.style.display = 'none';
  clearTokenCard();
  const isLoop2 = state.loop === 2;
  shenScene.classList.add('show');
  sceneCanvas.className = 'scene-canvas ' + (isLoop2 ? 'day' : 'night');
  sceneCanvas.innerHTML = '';

  const deco1 = document.createElement('div');
  deco1.className = 'scene-deco'; deco1.style.left = '5%'; deco1.style.top = '5%';
  deco1.textContent = isLoop2 ? '☀️' : '🏮';
  sceneCanvas.appendChild(deco1);
  const deco2 = document.createElement('div');
  deco2.className = 'scene-deco'; deco2.style.right = '5%'; deco2.style.top = '5%';
  deco2.textContent = '🚪';
  sceneCanvas.appendChild(deco2);

  const wall = document.createElement('div');
  wall.className = 'scene-wall';
  wall.innerHTML = `<div class="wall-text">钗 头 令</div>`;
  sceneCanvas.appendChild(wall);

  const objList = isLoop2 ? shenData.objects2 : shenData.objects1;
  objList.forEach(obj => {
    if (!isObjUnlocked(obj)) return;
    const el = document.createElement('div');
    el.className = 'obj' + (obj.isNpc ? ' npc' : '');
    if (state.shen.npcGone && obj.isNpc) el.classList.add('gone');
    el.dataset.id = obj.id;
    el.style.left = obj.pos.left; el.style.top = obj.pos.top;
    el.textContent = obj.icon;
    const label = document.createElement('div');
    label.className = 'label'; label.textContent = obj.label;
    el.appendChild(label);
    el.onclick = () => handleObjClick(obj, el);
    sceneCanvas.appendChild(el);
  });

  panel.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-title">${isLoop2 ? '沈 园 · 白 日' : '沈 园 · 夜 探'}<span class="tag">点击画面里的物件</span></div>`;
  card.innerHTML += `<div style="font-size:clamp(12px,3.2vw,14px);color:#5a3a1a;line-height:1.8;">${isLoop2 ? '灰已抹平，还有没擦净的字。' : '点画面里的物件，看看能发现什么。有些东西藏得深，得先找到别的才看得见。'}</div>`;
  panel.appendChild(card);

  showNextButton('进入推演 →', () => enterDeduce());

  if (!state.shen._tipShown) {
    state.shen._tipShown = true;
    feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 沈园的夜。</span> 点画面里的物件，看看能发现什么。`;
    flashFeedback();
  }
  updateStats();
  main.scrollTop = 0;
}

function isObjUnlocked(obj) {
  if (!obj.unlock) return true;
  return obj.unlock.split('+').every(u => state.shen.discovered.includes(u) || state.collectedClues.includes(u));
}

function handleObjClick(obj, el) {
  if (state.shen.npcGone && obj.isNpc) {
    AudioEngine.objLocked();
    el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400);
    feedbackEl.innerHTML = `<span style="color:#8b7355;">${obj.label}已经走了。</span> 你回探索得太晚，他们不等了。`;
    flashFeedback(); return;
  }
  if (state.shen.discovered.includes(obj.id)) {
    AudioEngine.objLocked();
    el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400);
    feedbackEl.innerHTML = `<span style="color:#8b7355;">${obj.label}，你已经看过了。</span>`;
    flashFeedback(); return;
  }
  AudioEngine.objTap();
  el.classList.add('glow'); setTimeout(() => el.classList.remove('glow'), 700);
  if (obj.isNpc) { openTopicPanel(obj.id); return; }
  state.shen.discovered.push(obj.id);
  if (obj.clue) {
    addClue(obj.clue);
    showCluePopup('新线索', obj.clue, obj.desc);
    feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 发现「${obj.clue}」</span> ${obj.desc}`;
    flashFeedback();
  }
  setTimeout(() => { if (shenScene.classList.contains('show')) renderShenScene(); }, 300);
}

/* ============================================================
   NPC 对话
   ============================================================ */
function getNpcData(npcId) {
  const base = shenData.npcs[npcId];
  return { ...base, topics: state.loop === 2 ? base.topics2 : base.topics1 };
}

function updateTpHead(npc) {
  const att = state.shen.attitudes[state.shen.currentNpc] || 0;
  const attText = att >= 2 ? '信任' : att >= 1 ? '放松' : att <= -2 ? '防备' : att <= -1 ? '冷淡' : '平常';
  const attStr = `态度：${attText}（${att >= 0 ? '+' : ''}${att}）`;
  ['tpFace','tpFace2','tpFace3'].forEach(id => { const el = $(id); if (el) el.textContent = npc.face; });
  ['tpName','tpName2','tpName3'].forEach(id => { const el = $(id); if (el) el.textContent = npc.name; });
  ['tpAtt','tpAtt2'].forEach(id => { const el = $(id); if (el) el.textContent = attStr; });
}

function openTopicPanel(npcId) {
  const npc = getNpcData(npcId);
  if (!npc) return;
  state.shen.currentNpc = npcId;
  if (!state.shen.dialogHistory[npcId]) state.shen.dialogHistory[npcId] = [];
  updateTpHead(npc);
  renderTopicsPage(npcId);
  renderHistoryPage(npcId);
  if (state.shen.dialogHistory[npcId].length > 0) showTopicPage('history');
  else showTopicPage('topics');
  topicPanel.classList.add('show');
}

function showTopicPage(which) {
  ['tpPageReply','tpPageTopics','tpPageHistory'].forEach(id => $(id).classList.remove('show'));
  if (which === 'reply') $('tpPageReply').classList.add('show');
  else if (which === 'topics') $('tpPageTopics').classList.add('show');
  else if (which === 'history') $('tpPageHistory').classList.add('show');
}

function renderReplyArea(npcId) {
  const area = $('tpReplyArea');
  const hist = state.shen.dialogHistory[npcId] || [];
  area.innerHTML = '';
  if (hist.length === 0) {
    const card = document.createElement('div');
    card.className = 'tp-reply-card';
    card.innerHTML = `<div class="who-tag">${getNpcData(npcId).name}</div><div class="reply-text">“你问吧。”</div>`;
    area.appendChild(card);
    return;
  }
  let last = null;
  for (let i = hist.length - 1; i >= 0; i--) {
    if (hist[i].who !== '你' && !hist[i].clue) { last = hist[i]; break; }
  }
  if (!last) last = hist[hist.length - 1];
  const card = document.createElement('div');
  card.className = 'tp-reply-card' + (last.clue ? ' clue' : '');
  card.innerHTML = `<div class="who-tag">${last.who}</div><div class="reply-text">${last.text}</div>`;
  area.appendChild(card);
}

function renderTopicsPage(npcId) {
  const npc = getNpcData(npcId);
  tpTopics.innerHTML = '';
  const asked = state.shen.askedTopics[npcId] || [];
  npc.topics.forEach(t => {
    if (t.need && !asked.includes(t.need) && !state.collectedClues.includes(t.need)) return;
    const b = document.createElement('button');
    b.className = 'topic-btn' + (asked.includes(t.id) ? ' asked' : '');
    b.textContent = t.text;
    b.disabled = asked.includes(t.id);
    b.onclick = () => askTopic(npcId, t);
    tpTopics.appendChild(b);
  });
  if (tpTopics.children.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'font-size:clamp(12px,3.2vw,14px);color:#8b7355;padding:8px 0;text-align:center;';
    empty.textContent = '他好像没什么想说的。';
    tpTopics.appendChild(empty);
  }
  tpTopicActions.innerHTML = '';
  if (state.tokens > 0) {
    const tBtn = document.createElement('button');
    tBtn.className = 'btn ghost'; tBtn.textContent = `递酒令签（+1，剩${state.tokens}）`;
    tBtn.onclick = () => {
      state.tokens--;
      state.shen.attitudes[npcId] = Math.min(2, (state.shen.attitudes[npcId] || 0) + 1);
      updateStats();
      showAttitude(`${npc.name} 态度 +1`);
      state.shen.dialogHistory[npcId].push({ who: '你', text: '（递了一枚酒令签）' });
      state.shen.dialogHistory[npcId].push({ who: npc.name, text: '（他收下了，脸色缓和了一些）' });
      updateTpHead(npc);
      renderHistoryPage(npcId);
      renderTopicsPage(npcId);
      feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 递了酒令签。</span>`;
      flashFeedback();
    };
    tpTopicActions.appendChild(tBtn);
  }
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn'; closeBtn.textContent = '先走一步';
  closeBtn.onclick = () => closeTopicPanel();
  tpTopicActions.appendChild(closeBtn);
}

function renderHistoryPage(npcId) {
  const hist = state.shen.dialogHistory[npcId] || [];
  const list = $('tpHistoryList');
  list.innerHTML = '';
  if (hist.length === 0) {
    list.innerHTML = `<div style="text-align:center;color:#8b7355;font-size:clamp(12px,3.2vw,14px);padding:16px 0;">还没有对话。</div>`;
    return;
  }
  hist.forEach(h => {
    const item = document.createElement('div');
    item.className = 'tp-history-item' + (h.who === '你' ? ' me' : '');
    item.innerHTML = `<div class="h-who">${h.who}</div>${h.text}`;
    list.appendChild(item);
  });
}

function askTopic(npcId, topic) {
  AudioEngine.tap();
  const npc = getNpcData(npcId);
  const asked = state.shen.askedTopics[npcId] || [];
  if (asked.includes(topic.id)) return;
  state.shen.askedTopics[npcId] = [...asked, topic.id];

  const oldAtt = state.shen.attitudes[npcId] || 0;
  state.shen.attitudes[npcId] = Math.max(-2, Math.min(2, oldAtt + topic.attitude));
  if (topic.attitude !== 0) showAttitude(`${npc.name} 态度 ${topic.attitude > 0 ? '+' : ''}${topic.attitude}`);

  const hist = state.shen.dialogHistory[npcId];
  hist.push({ who: '你', text: topic.text.replace(/^“|”$/g, '') });
  hist.push({ who: npc.name, text: topic.reply });

  if (topic.clue) {
    addClue(topic.clue);
    hist.push({ who: npc.name, text: `（你记下了：「${topic.clue}」）`, clue: true });
    showCluePopup('新线索', topic.clue, '');
    feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 获得「${topic.clue}」</span>`;
    flashFeedback();
  }

  updateTpHead(npc);
  renderReplyArea(npcId);
  renderTopicsPage(npcId);
  renderHistoryPage(npcId);
  showTopicPage('reply');

  const area = $('tpReplyArea');
  const acts = document.createElement('div');
  acts.style.cssText = 'display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:flex-end;';
  const backBtn = document.createElement('button');
  backBtn.className = 'btn'; backBtn.textContent = '继续问 →';
  backBtn.onclick = () => showTopicPage('topics');
  acts.appendChild(backBtn);
  const histBtn = document.createElement('button');
  histBtn.className = 'btn ghost'; histBtn.textContent = '看对话记录';
  histBtn.onclick = () => showTopicPage('history');
  acts.appendChild(histBtn);
  area.appendChild(acts);
}

function closeTopicPanel() {
  topicPanel.classList.remove('show');
  state.shen.currentNpc = null;
}

/* ============================================================
   推演
   ============================================================ */
function enterDeduce() {
  const missing = KEY_CLUES.filter(n => !state.collectedClues.includes(n));
  if (missing.length > 0) {
    feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 线索不足。</span> 还缺：${missing.join('、')}。请回到沈园继续探索，或与 NPC 交谈。`;
    flashFeedback();
    actionsEl.innerHTML = '';
    const back = document.createElement('button');
    back.className = 'btn ghost'; back.textContent = '← 回探索补线索';
    back.onclick = () => { AudioEngine.tap(); deduceArea.style.display = 'none'; renderShenScene(); };
    actionsEl.appendChild(back);
    const force = document.createElement('button');
    force.className = 'btn'; force.textContent = '直接指认 →';
    force.onclick = () => { AudioEngine.tap(); renderShenFinal(); };
    actionsEl.appendChild(force);
    return;
  }
  deduceArea.style.display = 'block';
  shenScene.classList.remove('show');
  panel.innerHTML = '';
  renderDeduce();
}

function renderDeduce() {
  ddSlots.innerHTML = '';
  shenData.deduceSlots.forEach(slot => {
    const d = document.createElement('div');
    d.dataset.slot = slot.id;
    d.style.cssText = 'padding:10px;background:rgba(240,228,200,0.5);border:1.5px dashed #a08a5a;border-radius:4px;cursor:pointer;transition:all 0.2s;';
    const assigned = state.shen.slotAssign[slot.id];
    if (assigned) { d.style.background = '#fffdf5'; d.style.borderStyle = 'solid'; d.style.borderColor = '#8b6b3a'; }
    if (state.shen.activeSlot === slot.id) { d.style.borderColor = '#c9a227'; d.style.boxShadow = '0 0 0 2px rgba(201,162,39,0.3)'; }
    d.innerHTML = `<div style="font-size:clamp(10px,2.6vw,11px);color:#8b1a1a;font-weight:bold;letter-spacing:0.1em;margin-bottom:2px;">${slot.time} · ${slot.hint}</div><div style="color:#3a1a10;font-size:clamp(11px,2.9vw,13px);line-height:1.5;">${assigned || '（点这里，再点下方线索）'}</div>`;
    d.onclick = () => { state.shen.activeSlot = slot.id; renderDeduce(); };
    ddSlots.appendChild(d);
  });

  ddClueList.innerHTML = '';
  KEY_CLUES.forEach(name => {
    if (!state.collectedClues.includes(name)) return;
    const used = Object.values(state.shen.slotAssign).includes(name);
    const b = document.createElement('button');
    b.textContent = name;
    b.style.cssText = `padding:8px 10px;background:#fffdf5;border:1px solid rgba(139,107,58,0.3);border-left:3px solid #c9a227;border-radius:4px;font-size:clamp(11px,2.9vw,13px);color:#3a1a10;cursor:pointer;text-align:left;font-family:inherit;${used?'opacity:0.4;cursor:default;':''}`;
    b.disabled = used;
    b.onclick = () => {
      if (used) return;
      if (!state.shen.activeSlot) { feedbackEl.innerHTML = `<span style="color:#8b7355;">先点一个时间槽，再选线索。</span>`; flashFeedback(); return; }
      const oldClue = state.shen.slotAssign[state.shen.activeSlot];
      if (oldClue) delete state.shen.slotAssign[state.shen.activeSlot];
      state.shen.slotAssign[state.shen.activeSlot] = name;
      state.shen.activeSlot = null;
      AudioEngine.tap();
      renderDeduce();
    };
    ddClueList.appendChild(b);
  });

  actionsEl.innerHTML = '';
  const backBtn = document.createElement('button');
  backBtn.className = 'btn ghost'; backBtn.textContent = '← 回探索';
  backBtn.style.marginRight = 'auto';
  backBtn.onclick = () => { AudioEngine.tap(); deduceArea.style.display = 'none'; renderShenScene(); };
  actionsEl.appendChild(backBtn);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn'; submitBtn.textContent = '推 演';
  submitBtn.onclick = () => {
    const filled = Object.keys(state.shen.slotAssign).length;
    if (filled < 4) { feedbackEl.innerHTML = `<span style="color:#8b7355;">还有时间槽没填。</span>`; flashFeedback(); return; }
    let allOk = true;
    shenData.deduceSlots.forEach(slot => {
      const assigned = state.shen.slotAssign[slot.id];
      const slotEl = ddSlots.querySelector(`[data-slot="${slot.id}"]`);
      if (assigned === slot.correct) {
        if (slotEl) { slotEl.style.background = '#eaf3e0'; slotEl.style.borderColor = '#6b8b4a'; }
      } else {
        if (slotEl) { slotEl.style.background = '#f8e0e0'; slotEl.style.borderColor = '#8b1a1a'; }
        allOk = false;
      }
    });
    if (allOk) {
      AudioEngine.deduceWin();
      state.shen.deduceSolved = true;
      feedbackEl.innerHTML = `<span style="color:#6b8b4a;">◆ 推演成功。</span> 案发顺序排对了。`;
      flashFeedback();
      actionsEl.innerHTML = '';
      const goBtn = document.createElement('button');
      goBtn.className = 'btn'; goBtn.textContent = '进入指认 →';
      goBtn.onclick = () => renderShenFinal();
      actionsEl.appendChild(goBtn);
    } else {
      AudioEngine.deduceFail();
      state.shen.deduceFailCount++;
      if (state.shen.deduceFailCount >= 3) {
        feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 推演失败三次。</span> 只能直接进入指认，结局评级会下降。`;
        flashFeedback();
        actionsEl.innerHTML = '';
        const goBtn = document.createElement('button');
        goBtn.className = 'btn'; goBtn.textContent = '直接指认 →';
        goBtn.onclick = () => renderShenFinal();
        actionsEl.appendChild(goBtn);
      } else {
        state.grit = Math.max(0, state.grit - 1);
        updateStats();
        feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 顺序不对。</span> 扣 1 点胆识。还能再排 ${3 - state.shen.deduceFailCount} 次。`;
        flashFeedback();
        setTimeout(() => { ddSlots.querySelectorAll('[data-slot]').forEach(el => { el.style.background = ''; el.style.borderColor = ''; }); }, 1500);
      }
    }
  };
  actionsEl.appendChild(submitBtn);
}

/* ============================================================
   沈园最终指认
   ============================================================ */
function renderShenFinal() {
  shenScene.classList.remove('show');
  deduceArea.style.display = 'none';
  panel.innerHTML = '';
  feedbackEl.textContent = '';
  state.phase = 'final';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-title">最 终 指 认<span class="tag">先指认凶手，再指认幕后</span></div>`;

  const p = document.createElement('p');
  p.style.cssText = 'font-size:clamp(13px,3.4vw,15px);color:#5a3a1a;line-height:1.75;margin-bottom:10px;';
  p.textContent = state.loop === 2
    ? '掌柜背对着你，声音很轻。这一次你知道得更多——但知道得越多，指认就越难。'
    : '掌柜站在词壁前，等着你开口。你手里攥着这一路收集的线索。';
  card.appendChild(p);

  const q = document.createElement('div');
  q.style.cssText = 'font-size:clamp(13px,3.6vw,16px);color:#3a1a10;font-weight:bold;margin-bottom:8px;line-height:1.6;';
  q.textContent = '第一步：谁杀了沈守拙？';
  card.appendChild(q);

  const killers = [
    { name:'苏见山', key:'su' },
    { name:'咸亨掌柜', key:'boss' },
    { name:'苏见山与咸亨掌柜', key:'both' }
  ];
  killers.forEach((k, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = `${String.fromCharCode(65+i)}. ${k.name}`;
    b.onclick = () => { AudioEngine.chooseKiller(); chooseShenKiller(k.key, card); };
    card.appendChild(b);
  });

  panel.appendChild(card);
  actionsEl.innerHTML = '';
  main.scrollTop = 0;
}

function chooseShenKiller(key, card) {
  if (state.phase !== 'final') return;
  state.phase = 'killer_chosen';
  card.querySelectorAll('.opt').forEach(b => b.disabled = true);
  state.killerCorrect = (key === 'both');

  setTimeout(() => {
    const q2 = document.createElement('div');
    q2.style.cssText = 'font-size:clamp(13px,3.6vw,16px);color:#3a1a10;font-weight:bold;margin:14px 0 8px;line-height:1.6;border-top:1px solid rgba(90,60,30,0.15);padding-top:12px;';
    q2.textContent = state.loop === 2 ? '第二步：谁不想让苏婉卿那半阕被看见？' : '第二步：谁不想让墙被刮开？';
    card.appendChild(q2);

    const masterminds = [
      { name:'沈家旁支', key:'shen' },
      { name:'沈守拙', key:'shou' },
      { name:'沈家旁支与沈守拙', key:'both2' }
    ];
    masterminds.forEach((m, i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = `${String.fromCharCode(65+i)}. ${m.name}`;
      b.onclick = () => { AudioEngine.chooseKiller(); chooseShenMastermind(m.key, card); };
      card.appendChild(b);
    });
    main.scrollTop = main.scrollHeight;
  }, 400);
}

function chooseShenMastermind(key, card) {
  if (state.phase !== 'killer_chosen') return;
  state.phase = 'mastermind_chosen';
  card.querySelectorAll('.opt').forEach(b => b.disabled = true);
  state.mastermindCorrect = (key === 'both2');

  if (state.loop === 2 && state.heart >= 2) {
    renderScrapeChoice(card);
  } else {
    finishShenFinal();
  }
}

function renderScrapeChoice(card) {
  const q = document.createElement('div');
  q.style.cssText = 'font-size:clamp(13px,3.6vw,16px);color:#3a1a10;font-weight:bold;margin:14px 0 8px;line-height:1.6;border-top:1px solid rgba(90,60,30,0.15);padding-top:12px;';
  q.textContent = '第三步：你打算怎么处理那层灰？';
  card.appendChild(q);
  const p = document.createElement('p');
  p.style.cssText = 'font-size:clamp(12px,3.1vw,14px);color:#8b7355;line-height:1.75;margin-bottom:8px;';
  p.textContent = '你的心证已满。你可以让那半阕重见天日，也可以让它留在灰下。';
  card.appendChild(p);

  const choices = [
    { text:'把灰刮开。', key:'scrape' },
    { text:'把灰重新抹上。', key:'keep' }
  ];
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'opt heart-choice';
    b.textContent = `${String.fromCharCode(65+i)}. ${c.text}`;
    b.onclick = () => {
      AudioEngine.heart();
      state.scrapeChoice = c.key;
      card.querySelectorAll('.opt').forEach(x => x.disabled = true);
      b.classList.add('correct');
      feedbackEl.innerHTML = `<span style="color:#8b1a1a;">◆ 心证已定。</span>`;
      flashFeedback();
      showNextButton('查看结局 →', finishShenFinal);
    };
    card.appendChild(b);
  });
  main.scrollTop = main.scrollHeight;
}

function finishShenFinal() {
  state.phase = 'result';
  const c = state.clues;
  const killerOk = state.killerCorrect, masterOk = state.mastermindCorrect;
  const deduceOk = state.shen && state.shen.deduceSolved;
  const deducePenalty = !deduceOk || (state.shen && state.shen.deduceFailCount >= 3);
  const scrape = state.scrapeChoice || null;
  let title, rank, detail;

  if (state.loop === 1) {
    if (killerOk && masterOk && c >= 4 && !deducePenalty) {
      title = '真 相 的 一 半'; rank = '上 上';
      detail = '你指认苏见山拔刀、掌柜按手，两个人一起送走了沈守拙。你也指认了沈家守了八百年的事。但墙下面到底是什么，你没打开看。';
    } else if (killerOk && !masterOk) {
      title = '抓 住 了 手'; rank = '中 上';
      detail = '你指认了苏见山和掌柜，却指错了幕后。你抓到了手，却没看到手后面是谁。';
    } else if (!killerOk && masterOk) {
      title = '看 见 了 影'; rank = '中 上';
      detail = '你指错了凶手，却指对了沈家。沈守拙的案子成了悬案。';
    } else if (killerOk || masterOk) {
      title = '差 一 步'; rank = '中 平';
      detail = '你只指对了一半。沈园的灯笼晃了晃。';
    } else {
      title = '夜 深 灯 灭'; rank = '下 下';
      detail = '你什么都没指对。掌柜转身走进月门。';
    }
    if (deducePenalty) { title += '（推演未成）'; rank = rank.replace('上', '中'); }
  } else {
    if (killerOk && masterOk && c >= 6 && !deducePenalty) {
      if (scrape === 'scrape') {
        title = '钗 头 重 见'; rank = '上 上 上';
        detail = '你刮开灰。墙上两层字。沈砚之的《钗头令》在上，苏婉卿的和词在下，署着“苏婉卿”。八百年灰落一地。';
      } else if (scrape === 'keep') {
        title = '灰 下 留 名'; rank = '上 上 上';
        detail = '你把灰重新抹上。墙上还是只有沈砚之那一阕。苏婉卿那半阕，仍然在灰下面。你走出沈园时回头看了一眼。你知道那半阕还在。知道，不等于要说出去。';
      } else {
        title = '真 相 大 白'; rank = '上 上 上';
        detail = '你指认了苏见山和掌柜，指认了沈家。墙下面那半阕，你没打开看。';
      }
    } else if (killerOk && masterOk) {
      title = '真 相 的 一 半'; rank = '上 上';
      detail = '你指对了凶手和幕后，但线索太少。';
    } else if (killerOk || masterOk) {
      title = '差 一 步'; rank = '中 平';
      detail = '你只指对了一半。';
    } else {
      title = '你 才 是 推 手'; rank = '？';
      detail = '你什么都没指对。掌柜忽然笑了：“其实，你三天前托我寻词笺的时候，就已经卷进来了。”';
    }
    if (deducePenalty) { title += '（推演未成）'; rank = rank.replace('上上上', '中上').replace('上上', '中上').replace('上', '中'); }
  }

  state.ending = { title, rank, detail, truth: buildTruth(state.loop, scrape) };
  feedbackEl.innerHTML = `<span style="color:#8b1a1a;font-weight:bold;">${title}</span>`;
  flashFeedback();
  if (rank.includes('上')) AudioEngine.endGood(); else AudioEngine.endBad();
  showNextButton('查看结局 →', renderEnding);
}

/* ============================================================
   故事真相
   ============================================================ */
function buildTruth(loop, scrape) {
  if (loop === 1) {
    return [
      '沈园的粉墙上，刻着沈砚之的《钗头令》。这阕词被世代传抄，字迹被摸得发亮。可墙上又覆着一层新抹的灰——有人想盖住灰下的什么，也有人一心要把它刮开。',
      '沈守拙是这一代的守亭人，替沈家守着这面墙。咸亨掌柜是他的旧交，守了他二十年。',
      '案发当夜，沈守拙到兰亭与掌柜争吵。苏见山随后赶到，拔刀相逼。刀插进了沈守拙的胸口。沈守拙临死前说“别刮”——他不愿苏见山背上杀人的名，也不愿那层灰被揭开。掌柜按着他的手，把灰抹了回去。',
      '苏见山拔了刀，掌柜按了手，两个人一起送走了沈守拙。阿沈知道苏见山要去兰亭，没有拦——他想让那层灰被刮开，却不敢自己动手。',
      '这是一桩没有凶手的凶案。每个人都在守一样东西：沈守拙守那层灰，掌柜守旧交，苏见山守一个想重见天日的名字，阿沈守一个不敢说出口的等待。至于那层灰下面到底藏着什么、苏见山要的那个名字是谁——这一周目你看不清，要等下一周目。'
    ];
  }
  // 第二周目
  const base = [
    '沈砚之写下《钗头令》，苏婉卿和了一阕。沈家却将和词封在灰下，不肯署名。沈守拙守了八百年，守的不是词，是一个不能说的名字。',
    '苏见山是苏婉卿的后人。他托你寻词笺，是想凑齐刮墙的由头。咸亨掌柜守着沈守拙，沈守拙守着秘密，阿沈守着祖上盖过的那层灰。',
    '案发当夜，兰亭里三个人：掌柜、沈守拙、苏见山。苏见山拔刀，刀入胸口。沈守拙临死说“别刮”，让掌柜别声张——他不愿苏见山背上杀人的名。掌柜按着他的手，把灰抹了回去。'
  ];
  if (scrape === 'scrape') {
    return base.concat([
      '灰下那半阕终于重见天日：苏婉卿的和词，署着她的名字。八百年的灰落了一地。',
      '你刮开了。苏婉卿的名字回到了墙上。沈守拙守了八百年不许人碰的东西，在你手里碎了，也完整了。'
    ]);
  } else if (scrape === 'keep') {
    return base.concat([
      '你把灰重新抹上。墙上还是只有沈砚之那一阕。苏婉卿那半阕，仍然在灰下面。',
      '你走出沈园时回头看了一眼。你知道那半阕还在。知道，不等于要说出去。沈守拙守了八百年的东西，你替他再守一段。'
    ]);
  }
  return base.concat([
    '墙下面那半阕，你始终没打开看。但你已经知道它在那里——苏婉卿的名字，沈守拙的八百年，掌柜的二十年，阿沈的一辈子。',
    '有些真相不必刮开灰，也能被记住。'
  ]);
}

/* ============================================================
   前四关小游戏

function makeCard(title, tag) {

  card.className = 'card';
  const t = document.createElement('div');
  t.className = 'card-title';
  t.innerHTML = `${title}<span class="tag">${tag||''}</span>`;
  card.appendChild(t);
  return card;
}

function renderZi(s) {
  panel.innerHTML = '';
  const card = makeCard('辨 字 令', '从字形辨出残缺的字');
  const p = document.createElement('div');

let pinState = null;
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderPin(s) {
  panel.innerHTML = '';
  const card = makeCard('拼 帖 令', '按顺序点字 · 可撤销');
  const g = s.pin;
  let shuffled, attempts = 0;
  do { shuffled = shuffle(g.sentence); attempts++; } while (shuffled.join('') === g.sentence.join('') && attempts < 20);
  pinState = { placed: [], pool: shuffled.map((ch, i) => ({ ch, id: i, used: false })), g };
  const p = document.createElement('div');
  p.className = 'zi-prompt'; p.textContent = g.prompt;
  card.appendChild(p);
  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:clamp(11px,3vw,13px);color:#8b7355;margin-bottom:10px;line-height:1.7;';
  hint.textContent = '提示：' + g.hint;
  card.appendChild(hint);
  const slots = document.createElement('div');
  slots.className = 'pin-slots'; slots.id = 'pinSlots';
  card.appendChild(slots);
  const pool = document.createElement('div');
  pool.className = 'pin-pool'; pool.id = 'pinPool';
  card.appendChild(pool);
  const pinActions = document.createElement('div');
  pinActions.className = 'pin-actions';
  const undoBtn = document.createElement('button');
  undoBtn.className = 'pin-undo'; undoBtn.id = 'pinUndo'; undoBtn.textContent = '↶ 撤销上一步';
  undoBtn.onclick = () => { AudioEngine.undo(); undoPin(); };
  pinActions.appendChild(undoBtn);
  card.appendChild(pinActions);
  panel.appendChild(card);
  renderPinBoard();
}
function renderPinBoard() {
  const slotsEl = $('pinSlots'), poolEl = $('pinPool');
  if (!slotsEl || !poolEl || !pinState) return;
  const total = pinState.g.sentence.length;
  const locked = state.phase === 'result';
  slotsEl.innerHTML = ''; poolEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'pin-slot';
    if (pinState.placed[i]) {
      d.textContent = pinState.placed[i].ch;
      d.classList.add('filled');
      if (!locked) d.onclick = () => { AudioEngine.undo(); undoSlot(i); };
    }
    slotsEl.appendChild(d);
  }
  pinState.pool.forEach(tile => {
    const b = document.createElement('button');
    b.className = 'pin-tile' + (tile.used ? ' used' : '');
    b.textContent = tile.ch;
    if (!tile.used && !locked) b.onclick = () => { AudioEngine.tap(); pickPin(tile); };
    poolEl.appendChild(b);
  });
  const undoBtn = $('pinUndo');
  if (undoBtn) undoBtn.disabled = locked || pinState.placed.length === 0;
}
function pickPin(tile) {
  if (state.phase !== 'challenge' || !pinState) return;
  if (tile.used || pinState.placed.length >= pinState.g.sentence.length) return;
  tile.used = true; pinState.placed.push(tile); renderPinBoard();
  if (pinState.placed.length === pinState.g.sentence.length) checkPin();
}
function undoPin() {
  if (state.phase === 'result' || !pinState) return;
  const tile = pinState.placed.pop(); if (tile) tile.used = false;
  renderPinBoard();
}
function undoSlot(idx) {
  if (state.phase === 'result' || !pinState) return;
  const removed = pinState.placed.splice(idx); removed.forEach(t => t.used = false);
  renderPinBoard();
}
function checkPin() {
  if (!pinState) return;
  state.phase = 'result';
  const g = pinState.g;
  const userSeq = pinState.placed.map(t => t.ch).join('');
  const correctSeq = g.sentence.join('');
  const slotsEl = $('pinSlots');
  const ok = userSeq === correctSeq;
  if (slotsEl) slotsEl.querySelectorAll('.pin-slot').forEach((sl, i) => setTimeout(() => sl.classList.add(ok ? 'ok' : ''), i * 60));
  renderPinBoard();
  if (ok) {
    feedbackEl.innerHTML = `<span style="color:#6b8b4a;">✓ 拼对了。</span> ${g.tip}<br><span style="color:#8b1a1a;">获线索：「${g.winClue}」</span>`;
    addClue(g.winClue); state.grit++; updateStats(); setTimeout(() => AudioEngine.pinCorrect(), 300);
  } else {
    feedbackEl.innerHTML = `<span style="color:#8b1a1a;">✗ 拼错了。</span> 正确顺序是「${correctSeq}」。${g.tip}<br><span style="color:#8b7355;">${g.loseDesc}</span>`;
    AudioEngine.pinWrong();
  }
  flashFeedback();
  showNextButton('继续追查 →', () => renderHeartChoice(scenes[state.scene], advance));
}

function openNpcDialog(sceneIdx) {
  const s = scenes[sceneIdx];
  if (!s || !s.npc) return;
  const npc = s.npc;
  overlayInner.style.display = 'block';
  overlayInner.classList.add('show');
  $('dialogTitle').textContent = '问 询 · ' + npc.name;
  let html = `<div class="npc-line"><div class="npc-face">${npc.face}</div>
    <div><div class="npc-name">${npc.name}</div><div class="npc-role">${npc.role}</div></div></div>`;
  html += `<div class="testimony">`;
  npc.testimony.filter(t => t.loop <= state.loop).forEach(t => html += `<div class="quote">${t.text}</div>`);
  html += `</div>`;
  npc.contradictions.filter(c => c.loop <= state.loop).forEach(c => {
    if (state.pressedContradictions.includes(c.id)) {
      html += `<div class="contradiction"><strong>已戳破：</strong>${c.press}<br><span style="color:#2a1e14;">${c.reveal}</span><br><span style="color:#8b1a1a;">获线索：「${c.clue}」</span></div>`;
    } else {
      const can = state.grit >= c.gritCost;
      html += `<div class="contradiction ${can?'':'locked'}"><strong>疑点：</strong>${c.doubt}<br>
        <button class="pressBtn" ${can?'':'disabled'} onclick="pressContradiction('${c.id}')">质问（消耗胆识 ×${c.gritCost}）</button></div>`;
    }
  });
  if (!npc.contradictions.some(c => c.loop <= state.loop)) html += `<div class="contradiction locked">你暂时看不出什么破绽。</div>`;
  $('dialogBody').innerHTML = html;
  overlayInner.scrollTop = 0;
}
function closeOverlay() {
  AudioEngine.tap();
  overlayInner.classList.remove('show');
  overlayInner.style.display = 'none';
  overlayInner.scrollTop = 0;
}
function pressContradiction(cid) {
  let target = null, si = -1;
  scenes.forEach((s,i) => { if (s.npc) s.npc.contradictions.forEach(c => { if (c.id===cid){target=c;si=i;} }); });
  if (!target || state.pressedContradictions.includes(cid) || state.grit < target.gritCost) return;
  state.grit -= target.gritCost; state.pressedContradictions.push(cid);
  addClue(target.clue);
  openNpcDialog(si);
}

  endScreen.classList.add('show');
  endScreen.style.display = 'block';
  const e = state.ending || { title:'归 途', rank:'中', detail:'你走出了绍兴城。', truth:'' };
  const titleChars = e.title.split('').map((ch, i) => `<span class="char" style="animation-delay:${i * 0.09}s">${ch}</span>`).join('');
  let html = `<h2>${titleChars}</h2><div class="rank">${e.rank}</div>
    <div class="verdict">收集 <strong>${state.clues}</strong> 条线索，戳破 <strong>${state.pressedContradictions.length}</strong> 处矛盾，心证 <strong>${state.heart}</strong>，剩余胆识 <strong>${state.grit}</strong>。</div>
    <div class="detail">${e.detail}</div>`;
  if (e.truth) {
    const paras = Array.isArray(e.truth) ? e.truth : [e.truth];
    html += `<div class="truth-card"><div class="tc-title">◆ 故事真相</div>${paras.map(p => `<p>${p}</p>`).join('')}</div>`;
  }
  html += `<div class="meta">线索：${state.collectedClues.length ? state.collectedClues.join(' · ') : '（无）'}</div>`;
  if (state.loop === 1) {
    html += `<div class="unlock"><strong>◆ 第二周目已解锁</strong><br>新周目将出现：各 NPC 全部换新证词；沈园换白天新图；可触及苏婉卿的真相。</div>
      <button class="btn" onclick="AudioEngine.tap(); startLoop2()">进 入 第 二 周 目</button>`;
  } else {
    html += `<div class="unlock"><strong>◆ 全本通关</strong><br>你已走完两周目。</div>
      <button class="btn" onclick="AudioEngine.tap(); location.reload()">从 头 再 走</button>`;
  }
  endScreen.innerHTML = html;
}

function startLoop2() {
  state.scene=0; state.phase='challenge'; state.tokens=2; state.clues=0; state.grit=3; state.heart=0;
  state.loop=2; state.collectedClues=[]; state.usedTokens=[]; state.pressedContradictions=[];
  state.ending=null; state.shen=null;
  state.killerCorrect=false; state.mastermindCorrect=false; state.scrapeChoice=null;
  topbar.style.display = 'flex';
  route.style.display = 'flex';
  sceneBox.style.display = 'block';
  feedbackEl.style.display = 'block';
  actionsEl.style.display = 'flex';
  clueBar.style.display = 'none';
  endScreen.style.display = 'none';
  endScreen.classList.remove('show');
  main.style.overflowY = 'auto';
  renderScene();
  main.scrollTop = 0;
}

function advance() {
  if (state.phase === 'result' || state.phase === 'wuxing' || state.phase === 'qp') {
    state.scene++; state.phase='challenge';
    if (state.scene >= scenes.length) { renderEnding(); return; }
    state.usedTokens = [];
    renderScene();
  }
}

renderScene();
</script>
</body>
</html>
